name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build (Command Line Tools only)
    runs-on: macos-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Build LiteWall.app
        run: ./build.sh

      - name: Verify signature
        run: codesign --verify --verbose=1 build/LiteWall.app

      - name: Verify wallpaper runtime contract
        # The probes need a GUI session; they are run locally via ./verify.sh.
        run: |
          if [ -d "Wallpapers/凡人女修/images" ]; then
            echo "slideshow assets present — running the full probe suite"
            ./verify.sh
          else
            echo "slideshow assets are generated (not in the repo) — skipping probes"
          fi
